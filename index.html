!DOCTYPE htm l> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>دنيا الأطفال | متجر ألعاب</title> <style> *{box-sizing:border-box} body{ margin:0; font-family:Tahoma,Arial,sans-serif; background:#f7f8fc; color:#222; } header{ background:linear-gradient(135deg,#ff6b6b,#ff9f43); color:white; text-align:center; padding:25px 15px; } header h1{ margin:0 0 8px; font-size:32px; } header p{ margin:0; font-size:16px; } .container{ max-width:1100px; margin:auto; padding:20px; } .top-buttons{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; } button{ border:none; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:bold; cursor:pointer; } .settings-btn{background:#333;color:white} .cart-btn{background:#ff6b6b;color:white} .whatsapp-btn{background:#25d366;color:white} .products{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:20px; } .product{ background:white; border-radius:18px; overflow:hidden; box-shadow:0 4px 15px #0001; padding-bottom:15px; } .product img{ width:100%; height:220px; object-fit:cover; background:#eee; } .product h3{ margin:12px; margin-bottom:5px; } .description{ color:#666; margin:0 12px; min-height:40px; } .price{ font-size:22px; font-weight:bold; color:#e85d04; margin:12px; } .product-buttons{ display:flex; gap:7px; padding:0 12px; } .product-buttons button{ flex:1; } .buy{ background:#ff6b6b; color:white; } .add{ background:#25d366; color:white; } .order{ background:white; border-radius:18px; padding:20px; margin-top:25px; box-shadow:0 4px 15px #0001; } .order h2{ text-align:center; } .cart-item{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:10px 0; gap:10px; } .total{ font-size:23px; font-weight:bold; margin:18px 0; color:#e85d04; } label{ display:block; font-weight:bold; margin-top:12px; } input,textarea{ width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; margin-top:6px; font-family:inherit; font-size:15px; } textarea{ min-height:90px; resize:vertical; } .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .send{ width:100%; margin-top:18px; background:#25d366; color:white; font-size:18px; } .note{ text-align:center; color:#777; font-size:13px; } .modal{ display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:#0009; overflow:auto; padding:20px; } .modal-box{ background:white; max-width:700px; margin:20px auto; border-radius:18px; padding:20px; } .close{ float:left; background:#eee; } .setting-product{ border:1px solid #ddd; border-radius:14px; padding:15px; margin:15px 0; } .setting-product img{ width:100px; height:80px; object-fit:cover; border-radius:10px; display:block; margin-bottom:10px; } .save{ width:100%; background:#ff6b6b; color:white; font-size:18px; margin-top:15px; } .delete{ background:#dc3545; color:white; margin-top:10px; } .add-product{ background:#333; color:white; margin-top:10px; } hr{ border:none; border-top:1px solid #eee; margin:20px 0; } @media(max-width:600px){ .row{ grid-template-columns:1fr; } header h1{ font-size:26px; } .product-buttons{ flex-direction:column; } } </style> </head> <body> <header> <h1 id="storeName">دنيا الأطفال</h1> <p id="storeDescription">متجر ألعاب الأطفال — اطلب الآن عبر WhatsApp</p> </header> <div class="container"> <div class="top-buttons"> <button class="settings-btn" onclick="openSettings()">⚙️ إعدادات المتجر</button> <button class="cart-btn" onclick="goToOrder()">🛒 السلة والطلب</button> </div> <div id="products" class="products"></div> <div class="order" id="order"> <h2>🛍️ معلومات الزبون والطلب</h2> <div id="cart"></div> <div class="total"> المجموع: <span id="total">0</span> دج </div> <label>👤 اسم الزبون</label> <input id="customerName" placeholder="اكتب اسمك"> <div class="row"> <div> <label>📞 رقم الهاتف</label> <input id="customerPhone" placeholder="مثال: 0550000000"> </div> <div> <label>🏙️ الولاية / البلدية</label> <input id="customerCity" placeholder="مثال: سطيف / بابور"> </div> </div> <label>🏠 عنوان التوصيل</label> <input id="customerAddress" placeholder="اكتب عنوان التوصيل"> <label>📝 ملاحظات</label> <textarea id="customerNote" placeholder="أي ملاحظة خاصة بالطلب"></textarea> <button class="send" onclick="sendWhatsApp()"> 💬 إرسال الطلب عبر WhatsApp </button> <p class="note"> WhatsApp: <span id="whatsappDisplay">0674456415</span> </p> </div> </div> <!-- نافذة الإعدادات --> <div class="modal" id="settingsModal"> <div class="modal-box"> <button class="close" onclick="closeSettings()">✖ إغلاق</button> <h2>⚙️ إعدادات المتجر</h2> <label>اسم المتجر</label> <input id="setStoreName"> <label>وصف المتجر</label> <input id="setStoreDescription"> <label>📞 رقم WhatsApp</label> <input id="setWhatsapp"> <hr> <h3>➕ إضافة منتج جديد</h3> <label>اسم المنتج</label> <input id="newName" placeholder="مثال: لعبة أطفال"> <label>السعر</label> <input id="newPrice" type="number" placeholder="2500"> <label>وصف المنتج</label> <textarea id="newDescription"></textarea> <label>🖼️ صورة المنتج</label> <input id="newImage" type="file" accept="image/*"> <button class="add-product" onclick="addProduct()"> ➕ إضافة المنتج </button> <hr> <h3>✏️ تعديل المنتجات</h3> <div id="settingsProducts"></div> <button class="save" onclick="saveAllSettings()"> 💾 حفظ كل الإعدادات </button> </div> </div> <script> const defaultProducts = [ { name:"SUP Game Box", price:2500, description:"جهاز ألعاب ممتع للأطفال", image:"https://placehold.co/600x450?text=SUP+Game+Box" }, { name:"مزلاقة أطفال", price:3200, description:"مزلاقة جميلة وممتعة للأطفال", image:"https://placehold.co/600x450?text=مزلاقة" }, { name:"بيبي فوت", price:4000, description:"لعبة بيبي فوت للأطفال", image:"https://placehold.co/600x450?text=بيبي+فوت" }, { name:"كيس الملاكمة", price:3000, description:"لعبة ملاكمة ممتعة للأطفال", image:"https://placehold.co/600x450?text=ملاكمة" } ]; let products = JSON.parse(localStorage.getItem("douniaProducts")) || defaultProducts; let settings = JSON.parse(localStorage.getItem("douniaSettings")) || { storeName:"دنيا الأطفال", storeDescription: "متجر ألعاب الأطفال — اطلب الآن عبر WhatsApp", whatsapp:"0674456415" }; let cart = JSON.parse(localStorage.getItem("douniaCart")) || []; function escapeHTML(text){ return String(text) .replace(/&/g,"&amp;") .replace(/</g,"&lt;") .replace(/>/g,"&gt;") .replace(/"/g,"&quot;") .replace(/'/g,"&#039;"); } function render(){ document.getElementById("storeName").textContent = settings.storeName; document.getElementById("storeDescription").textContent = settings.storeDescription; document.getElementById("whatsappDisplay").textContent = settings.whatsapp; const container = document.getElementById("products"); container.innerHTML=""; products.forEach((product,index)=>{ container.innerHTML += ` <div class="product"> <img src="${product.image}" alt="${escapeHTML(product.name)}"> <h3>${escapeHTML(product.name)}</h3> <p class="description"> ${escapeHTML(product.description)} </p> <div class="price"> ${Number(product.price).toLocaleString("ar-DZ")} دج </div> <div class="product-buttons"> <button class="add" onclick="addToCart(${index})"> 🛒 أضف للسلة </button> <button class="buy" onclick="buyNow(${index})"> ⚡ اطلب الآن </button> </div> </div> `; }); renderCart(); } function addToCart(index){ const found = cart.find(item=>item.index===index); if(found){ found.quantity++; }else{ cart.push({ index:index, quantity:1 }); } saveCart(); renderCart(); } function buyNow(index){ addToCart(index); goToOrder(); } function removeFromCart(position){ cart.splice(position,1); saveCart(); renderCart(); } function renderCart(){ const cartContainer = document.getElementById("cart"); cartContainer.innerHTML=""; let total=0; if(cart.length===0){ cartContainer.innerHTML = '<p class="note">السلة فارغة — اختر منتجًا للطلب.</p>'; }else{ cart.forEach((item,position)=>{ const product = products[item.index]; if(!product)return; const subtotal = product.price * item.quantity; total += subtotal; cartContainer.innerHTML += ` <div class="cart-item"> <span> ${escapeHTML(product.name)} × ${item.quantity} </span> <span> ${subtotal.toLocaleString("ar-DZ")} دج <button class="delete" style="padding:5px 8px;margin-right:5px" onclick="removeFromCart(${position})"> ✖ </button> </span> </div> `; }); } document.getElementById("total").textContent = total.toLocaleString("ar-DZ"); } function saveCart(){ localStorage.setItem( "douniaCart", JSON.stringify(cart) ); } function goToOrder(){ document.getElementById("order") .scrollIntoView({ behavior:"smooth" }); } function openSettings(){ document.getElementById("settingsModal") .style.display="block"; document.getElementById("setStoreName").value = settings.storeName; document.getElementById("setStoreDescription").value = settings.storeDescription; document.getElementById("setWhatsapp").value = settings.whatsapp; renderSettingsProducts(); } function closeSettings(){ document.getElementById("settingsModal") .style.display="none"; } function renderSettingsProducts(){ const box = document.getElementById("settingsProducts"); box.innerHTML=""; products.forEach((product,index)=>{ box.innerHTML += ` <div class="setting-product"> <h3>المنتج ${index+1}</h3> <img src="${product.image}"> <label>اسم المنتج</label> <input id="productName${index}" value="${escapeHTML(product.name)}"> <label>السعر</label> <input id="productPrice${index}" type="number" value="${product.price}"> <label>الوصف</label> <textarea id="productDescription${index}"> ${escapeHTML(product.description)} </textarea> <label>🖼️ تغيير الصورة</label> <input id="productImage${index}" type="file" accept="image/*"> <button class="delete" onclick="deleteProduct(${index})"> 🗑️ حذف المنتج </button> </div> `; }); } function saveAllSettings(){ settings.storeName = document.getElementById("setStoreName") .value.trim() ||"دنيا الأطفال"; settings.storeDescription = document.getElementById("setStoreDescription") .value.trim(); settings.whatsapp = document.getElementById("setWhatsapp") .value.trim() ||"0674456415"; const imageTasks=[]; products.forEach((product,index)=>{ product.name = document.getElementById("productName"+index) .value.trim() ||product.name; product.price = Number( document.getElementById("productPrice"+index) .value ) ||0; product.description = document.getElementById("productDescription"+index) .value.trim(); const file = document.getElementById("productImage"+index) .files[0]; if(file){ imageTasks.push( readImage(file).then(imageData=>{ product.image=imageData; }) ); } }); Promise.all(imageTasks).then(()=>{ localStorage.setItem( "douniaProducts", JSON.stringify(products) ); localStorage.setItem( "douniaSettings", JSON.stringify(settings) ); render(); closeSettings(); alert("✅ تم حفظ جميع الإعدادات بنجاح"); }); } function addProduct(){ const name = document.getElementById("newName") .value.trim(); const price = Number( document.getElementById("newPrice").value ); const description = document.getElementById("newDescription") .value.trim(); const imageFile = document.getElementById("newImage") .files[0]; if(!name){ alert("اكتب اسم المنتج"); return; } if(!price){ alert("اكتب سعر المنتج"); return; } if(imageFile){ readImage(imageFile).then(imageData=>{ products.push({ name:name, price:price, description:description, image:imageData }); finishAddingProduct(); }); }else{ products.push({ name:name, price:price, description:description, image:"https://placehold.co/600x450?text=منتج+جديد" }); finishAddingProduct(); } } function finishAddingProduct(){ localStorage.setItem( "douniaProducts", JSON.stringify(products) ); document.getElementById("newName").value=""; document.getElementById("newPrice").value=""; document.getElementById("newDescription").value=""; document.getElementById("newImage").value=""; render(); renderSettingsProducts(); alert("✅ تمت إضافة المنتج"); } function deleteProduct(index){ if(confirm("هل تريد حذف هذا المنتج؟")){ products.splice(index,1); localStorage.setItem( "douniaProducts", JSON.stringify(products) ); render(); renderSettingsProducts(); } } function readImage(file){ return new Promise((resolve,reject)=>{ const reader = new FileReader(); reader.onload=function(){ resolve(reader.result); }; reader.onerror=reject; reader.readAsDataURL(file); }); } function sendWhatsApp(){ if(cart.length===0){ alert("🛒 أضف منتجًا إلى السلة أولاً"); return; } const name = document.getElementById("customerName") .value.trim(); const phone = document.getElementById("customerPhone") .value.trim(); const city = document.getElementById("customerCity") .value.trim(); const address = document.getElementById("customerAddress") .value.trim(); const note = document.getElementById("customerNote") .value.trim(); if(!name || !phone || !city || !address){ alert( "⚠️ يرجى ملء اسم الزبون ورقم الهاتف والولاية/البلدية والعنوان" ); return; } let message = "🛍️ *طلب جديد من متجر دنيا الأطفال*%0A%0A"; let total=0; cart.forEach(item=>{ const product = products[item.index]; if(!product)return; const subtotal = product.price * item.quantity; total += subtotal; message += "• "+ product.name+ " × "+ item.quantity+ " = "+ subtotal+ " دج%0A"; }); message += "%0A💰 *المجموع: "+ total+ " دج*%0A"; message += "%0A👤 الاسم: "+ name; message += "%0A📞 الهاتف: "+ phone; message += "%0A🏙️ الولاية/البلدية: "+ city; message += "%0A🏠 العنوان: "+ address; if(note){ message += "%0A📝 الملاحظات: "+ note; } let number = settings.whatsapp .replace(/\D/g,""); if(number.startsWith("0")){ number = "213"+ number.substring(1); } const url = "https://wa.me/"+ number+ "?text="+ message; window.open(url,"_blank"); } render(); </script> </body> </html>
