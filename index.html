!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>دنيا الأطفال | متجر ألعاب</title> <style> *{box-sizing:border-box} body{ margin:0; font-family:Arial,Tahoma,sans-serif; background:#f5f6fa; color:#222; } header{ background:linear-gradient(135deg,#ff6b6b,#845ef7); color:white; text-align:center; padding:28px 15px; } header h1{margin:0;font-size:34px} header p{margin:10px 0 0;font-size:18px} nav{ background:white; padding:12px; text-align:center; box-shadow:0 2px 8px #ddd; position:sticky; top:0; z-index:10; } nav button{ border:0; background:#845ef7; color:white; padding:10px 18px; margin:4px; border-radius:20px; cursor:pointer; } .container{ max-width:1100px; margin:auto; padding:20px; } .search{ width:100%; padding:15px; border:1px solid #ddd; border-radius:10px; font-size:17px; margin-bottom:20px; } .products{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; } .card{ background:white; border-radius:15px; overflow:hidden; box-shadow:0 3px 12px #ddd; text-align:center; padding-bottom:18px; } .card img{ width:100%; height:190px; object-fit:cover; background:#eee; } .card h2{ font-size:20px; margin:12px 5px 8px; } .price{ color:#e03131; font-size:21px; font-weight:bold; } .card button{ margin-top:12px; border:0; background:#20c997; color:white; padding:12px 20px; border-radius:8px; cursor:pointer; font-size:16px; } .cart{ margin-top:35px; background:white; border-radius:15px; padding:20px; box-shadow:0 3px 12px #ddd; } .cart h2{margin-top:0} .cart-item{ border-bottom:1px solid #eee; padding:10px 0; } .order{ margin-top:20px; } .order input,.order textarea{ width:100%; padding:12px; margin:7px 0; border:1px solid #ccc; border-radius:8px; font-size:16px; } .order button{ width:100%; padding:14px; border:0; border-radius:8px; background:#25d366; color:white; font-size:18px; cursor:pointer; } footer{ margin-top:40px; background:#222; color:white; text-align:center; padding:25px; } .badge{ display:inline-block; background:#ffd43b; padding:5px 10px; border-radius:15px; font-size:13px; margin-top:8px; } </style> </head> <body> <header> <h1>🧸 دنيا الأطفال 🧸</h1> <p>ألعاب جميلة وممتعة للأطفال</p> <span class="badge">التوصيل متوفر حسب المنطقة</span> </header> <nav> <button onclick="showAll()">كل المنتجات</button> <button onclick="filterProducts('ألعاب')">🎮 ألعاب</button> <button onclick="filterProducts('أطفال')">🧒 أطفال</button> <button onclick="goCart()">🛒 السلة</button> </nav> <div class="container"> <input type="text" id="search" class="search" placeholder="🔎 ابحث عن منتج..." onkeyup="searchProducts()" > <div id="products" class="products"></div> <div class="cart" id="cart"> <h2>🛒 سلة المشتريات</h2> <div id="cartItems">السلة فارغة</div> <h3>المجموع: <span id="total">0</span> دج</h3> <div class="order"> <h2>📦 معلومات الطلب</h2> <input id="name" type="text" placeholder="الاسم واللقب"> <input id="phone" type="tel" placeholder="رقم الهاتف"> <input id="address" type="text" placeholder="العنوان والبلدية"> <textarea id="note" rows="3" placeholder="ملاحظة إضافية"></textarea> <button onclick="sendOrder()"> 📱 إرسال الطلب عبر واتساب </button> </div> </div> </div> <footer> <h3>دنيا الأطفال</h3> <p>متجر ألعاب وهدايا للأطفال</p> <p>© 2026 جميع الحقوق محفوظة</p> </footer> <script> const products = [ { name:"SUP Game Box", price:2500, category:"ألعاب", image:"https://via.placeholder.com/500x350?text=SUP+Game+Box" }, { name:"مزلفة أطفال", price:4000, category:"أطفال", image:"https://via.placeholder.com/500x350?text=Slide" }, { name:"كيس البوكس", price:3000, category:"أطفال", image:"https://via.placeholder.com/500x350?text=Box+Bag" }, { name:"طاكي واكي", price:2500, category:"ألعاب", image:"https://via.placeholder.com/500x350?text=Toy" }, { name:"لوحة إلكترونية للأطفال", price:1800, category:"أطفال", image:"https://via.placeholder.com/500x350?text=Kids+Board" }, { name:"نسر لعبة", price:2500, category:"ألعاب", image:"https://via.placeholder.com/500x350?text=Eagle+Toy" } ]; let cart=[]; function displayProducts(list=products){ const container=document.getElementById("products"); container.innerHTML=""; list.forEach((p,index)=>{ container.innerHTML+=` <div class="card"> <img src="${p.image}" alt="${p.name}"> <h2>${p.name}</h2> <div class="price">${p.price} دج</div> <button onclick="addToCart(${index})"> 🛒 أضف إلى السلة </button> </div> `; }); } function addToCart(index){ cart.push(products[index]); updateCart(); alert("تمت إضافة المنتج إلى السلة ✅"); } function updateCart(){ const box=document.getElementById("cartItems"); if(cart.length===0){ box.innerHTML="السلة فارغة"; document.getElementById("total").innerText="0"; return; } let total=0; box.innerHTML=""; cart.forEach((p,i)=>{ total+=p.price; box.innerHTML+=` <div class="cart-item"> <strong>${p.name}</strong> <br> ${p.price} دج <button onclick="removeFromCart(${i})"> ❌ حذف </button> </div> `; }); document.getElementById("total").innerText=total; } function removeFromCart(index){ cart.splice(index,1); updateCart(); } function searchProducts(){ const value=document.getElementById("search").value.toLowerCase(); const result=products.filter(p=> p.name.toLowerCase().includes(value) ); displayProducts(result); } function filterProducts(category){ const result=products.filter(p=> p.category===category ); displayProducts(result); } function showAll(){ displayProducts(products); } function goCart(){ document.getElementById("cart").scrollIntoView({ behavior:"smooth" }); } function sendOrder(){ if(cart.length===0){ alert("السلة فارغة ❌"); return; } const name=document.getElementById("name").value; const phone=document.getElementById("phone").value; const address=document.getElementById("address").value; const note=document.getElementById("note").value; if(!name || !phone || !address){ alert("يرجى إدخال الاسم والهاتف والعنوان"); return; } let message="طلب جديد من متجر دنيا الأطفال%0A%0A"; message+="الاسم: "+name+"%0A"; message+="الهاتف: "+phone+"%0A"; message+="العنوان: "+address+"%0A"; if(note){ message+="الملاحظة: "+note+"%0A"; } message+="%0Aالمنتجات:%0A"; let total=0; cart.forEach(p=>{ message+="- "+p.name+" : "+p.price+" دج%0A"; total+=p.price; }); message+="%0Aالمجموع: "+total+" دج"; const whatsapp="213000000000"; window.open( "https://wa.me/"+whatsapp+"?text="+message, "_blank" ); } displayProducts(); </script> </body> </html>
