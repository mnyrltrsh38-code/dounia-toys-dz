<style>
/* يشتغل في الهاتف والحاسوب */
*{box-sizing:border-box}
.store-box{width:100%;max-width:650px;margin:0 auto;direction:rtl;font-family:Tajawal,sans-serif}
.store-box input{display:none}
.main-img{width:100%;background:#fff;border-radius:18px;overflow:hidden;border:1px solid #eee;display:none;aspect-ratio:1/1}
.main-img img{width:100%;height:100%;object-fit:contain;display:block;padding:8px}

/* اظهار الصورة حسب الاختيار */
#pic1:checked ~ .m1{display:block}
#pic2:checked ~ .m2{display:block}
#pic3:checked ~ .m3{display:block}

/* الصور الصغيرة */
.thumb-box{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.thumb-box label{width:80px;height:80px;background:#fff;border-radius:12px;border:2px solid #e0e0e0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px;transition:0.2s}
.thumb-box label img{width:100%;height:100%;object-fit:contain}

/* اللون الاخضر للصورة النشطة */
#pic1:checked ~ .thumb-box label[for="pic1"]{border-color:#2e7d32;box-shadow:0 0 0 2px #2e7d3230}
#pic2:checked ~ .thumb-box label[for="pic2"]{border-color:#2e7d32;box-shadow:0 0 0 2px #2e7d3230}
#pic3:checked ~ .thumb-box label[for="pic3"]{border-color:#2e7d32;box-shadow:0 0 0 2px #2e7d3230}

/* السعر */
.price-box{margin-top:14px;background:linear-gradient(135deg,#2e7d32,#388e3c);color:#fff;text-align:center;padding:14px;border-radius:14px;font-size:22px;font-weight:bold}
.price-box span{color:#ffeb3b;font-size:26px}

/* للهاتف: يكبر ويملأ الشاشة */
@media(max-width:768px){
  .store-box{max-width:100%}
  .thumb-box label{width:22%;height:auto;aspect-ratio:1/1;min-width:65px}
  .price-box{font-size:18px}
  .price-box span{font-size:22px}
}
/* للحاسوب: يبقى في الوسط وجميل */
@media(min-width:769px){
  .store-box{max-width:600px}
  .thumb-box label:hover{transform:scale(1.05);border-color:#2e7d32}
}
</style>

<div class="store-box">
  <input type="radio" name="gallery" id="pic1" checked>
  <input type="radio" name="gallery" id="pic2">
  <input type="radio" name="gallery" id="pic3">

  <div class="main-img m1"><img src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" alt="منتج 1"></div>
  <div class="main-img m2"><img src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" alt="منتج 2"></div>
  <div class="main-img m3"><img src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" alt="منتج 3"></div>

  <div class="thumb-box">
    <label for="pic1"><img src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg"></label>
    <label for="pic2"><img src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg"></label>
    <label for="pic3"><img src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg"></label>
  </div>

  <div class="price-box"><span>2500 دج</span> - توصيل 58 ولاية - مدى 200 متر</div>
</div>
