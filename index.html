<div style="max-width:600px;margin:auto;font-family:Tajawal,sans-serif;direction:rtl">
  <div style="width:100%;aspect-ratio:1/1;background:#fff;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid #eee">
    <img id="mainImage" src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" style="width:95%;height:95%;object-fit:contain">
  </div>
  <div style="display:flex;gap:10px;margin-top:12px;justify-content:center">
    <img class="thumb active" onclick="changeImg(this,'https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg')" src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" style="width:80px;height:80px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid #2e7d32;cursor:pointer;padding:5px">
    <img class="thumb" onclick="changeImg(this,'https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg')" src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" style="width:80px;height:80px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid #eee;cursor:pointer;padding:5px">
    <img class="thumb" onclick="changeImg(this,'https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg')" src="https://res.cloudinary.com/tptjpbwc/image/upload/v1792662259/1792661915833.jpg" style="width:80px;height:80px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid #eee;cursor:pointer;padding:5px">
  </div>
  <div style="text-align:center;background:#2e7d32;color:#fff;padding:14px;border-radius:14px;margin-top:15px;font-size:24px;font-weight:bold"> <span style="color:#ffeb3b">2500</span> دج | مدى 200م - صوت واضح - تصميم ديناصور </div>
</div>
<script>
function changeImg(el,src){
document.getElementById('mainImage').src=src;
document.querySelectorAll('.thumb').forEach(i=>{i.style.borderColor='#eee';i.classList.remove('active')});
el.style.borderColor='#2e7d32';el.classList.add('active');
}
</script>
<style>.thumb.active{border-color:#2e7d32!important}</style>
