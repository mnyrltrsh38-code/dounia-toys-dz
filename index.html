
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دنيا الأطفال | متجر ألعاب</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#222}
header{background:linear-gradient(135deg,#ff6b6b,#ff9f43,#ffd32a);color:white;padding:28px 15px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:10px 0 0}
.container{max-width:1100px;margin:auto;padding:18px}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:20px}
.products,.admin-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.product,.cart-box,.order-form,.admin-box{background:white;border-radius:15px;padding:15px;margin-bottom:18px;box-shadow:0 3px 12px #00000010}
.product{text-align:center}
.pic{height:190px;background:#eee;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:65px;overflow:hidden}
.pic img,.admin-card img{width:100%;height:100%;object-fit:contain}
.price{font-size:21px;font-weight:bold;color:#e74c3c;margin:12px}
button{border:0;border-radius:9px;padding:11px 15px;font-size:15px;cursor:pointer}
.add,.save-btn{background:#27ae60;color:white;width:100%}
.whatsapp{background:#25d366;color:white;width:100%;font-size:18px;margin-top:12px}
.clear,.remove,.delete-btn{background:#e74c3c;color:white}
.field{margin-bottom:14px}
.field label{display:block;font-weight:bold;margin-bottom:7px}
.field input,.field select,.field textarea,.admin-card input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit}
.field textarea{height:85px}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{padding:6px 10px;background:#eee}
.total{font-size:21px;font-weight:bold;margin:15px 0}
.admin-toggle,.new-btn{background:#333;color:white;width:100%;margin:12px 0}
.admin-panel{display:none}
.admin-panel.show{display:block}
.admin-card{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px}
.admin-card img,.admin-image{height:140px;width:100%;object-fit:contain;background:#eee;margin-bottom:10px}
.admin-card input{margin-bottom:8px}
.image-label{display:block;background:#8e44ad;color:white;text-align:center;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:8px}
.image-input{display:none!important}
footer{text-align:center;background:#222;color:white;padding:25px;margin-top:25px}
.empty{text-align:center;color:#777;padding:20px}
@media(max-width:600px){header h1{font-size:25px}.container{padding:12px}.pic{height:170px}.cart-item{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>

<header>
<h1>🧸 دنيا الأطفال 🎁</h1>
<p>ألعاب ممتعة وفرحة لكل طفل ❤️</p>
</header>

<div class="container">
<input class="search" id="search" placeholder="🔎 ابحث عن لعبة..." oninput="displayProducts()">
<div class="products" id="products"></div>

<div class="cart-box">
<h2>🛒 سلة المشتريات</h2>
<div id="cart"></div>
<div class="total">المجموع: <span id="total">0</span> دج</div>
<button class="clear" onclick="clearCart()">إفراغ السلة</button>
</div>

<div class="order-form">
<h2>📦 معلومات الزبون والطلبية</h2>

<div class="field">
<label for="customerName">الاسم واللقب *</label>
<input id="customerName" placeholder="اكتب اسمك ولقبك">
</div>

<div class="field">
<label for="phone">رقم الهاتف *</label>
<input id="phone" type="tel" placeholder="مثال: 0550000000">
</div>

<div class="field">
<label for="wilaya">الولاية *</label>
<select id="wilaya">
<option value="">اختر الولاية</option>
<option>أدرار</option><option>الشلف</option><option>الأغواط</option>
<option>أم البواقي</option><option>باتنة</option><option>بجاية</option>
<option>بسكرة</option><option>بشار</option><option>البليدة</option>
<option>البويرة</option><option>تمنراست</option><option>تبسة</option>
<option>تلمسان</option><option>تيارت</option><option>تيزي وزو</option>
<option>الجزائر</option><option>الجلفة</option><option>جيجل</option>
<option>سطيف</option><option>سعيدة</option><option>سكيكدة</option>
<option>سيدي بلعباس</option><option>عنابة</option><option>قالمة</option>
<option>قسنطينة</option><option>المدية</option><option>مستغانم</option>
<option>المسيلة</option><option>معسكر</option><option>ورقلة</option>
<option>وهران</option><option>البيض</option><option>إليزي</option>
<option>برج بوعريريج</option><option>بومرداس</option><option>الطارف</option>
<option>تندوف</option><option>تيسمسيلت</option><option>الوادي</option>
<option>خنشلة</option><option>سوق أهراس</option><option>تيبازة</option>
<option>ميلة</option><option>عين الدفلى</option><option>النعامة</option>
<option>عين تموشنت</option><option>غرداية</option><option>غليزان</option>
<option>تيميمون</option><option>برج باجي مختار</option><option>أولاد جلال</option>
<option>بني عباس</option><option>عين صالح</option><option>عين قزام</option>
<option>تقرت</option><option>جانت</option><option>المغير</option>
<option>المنيعة</option><option>بشار</option>
</select>
</div>

<div class="field">
<label for="address">البلدية والشارع *</label>
<input id="address" placeholder="اكتب البلدية والعنوان">
</div>

<div class="field">
<label for="notes">ملاحظات إضافية</label>
<textarea id="notes" placeholder="ملاحظات حول الطلبية (اختياري)"></textarea>
</div>

<button class="whatsapp" onclick="sendOrder()">📲 إرسال الطلبية عبر WhatsApp</button>
</div>

<button class="admin-toggle" onclick="toggleAdmin()">⚙️ إدارة المنتجات</button>
<div class="admin-panel" id="adminPanel">
<div class="admin-box">
<h2>إدارة منتجات دنيا الأطفال</h2>
<p>غيّر اسم المنتج وسعره أو أضف صورته من جهازك، ثم احفظ.</p>
<button class="new-btn" onclick="addNewProduct()">➕ إضافة منتج جديد</button>
<div class="admin-products" id="adminProducts"></div>
</div>
</div>
</div>

<footer>🧸 دنيا الأطفال<br>متعة وفرحة لكل طفل ❤️</footer>

<script>
const WHATSAPP = "213674456415";
const STORAGE_KEY = "dounia_products";

const defaultProducts = [
{id:1,name:"SUP Game Box",price:2500,emoji:"🎮",image:""},
{id:2,name:"مزلاقة أطفال",price:3200,emoji:"🛝",image:""},
{id:3,name:"بيبي فوت",price:4000,emoji:"⚽",image:""},
{id:4,name:"كيس الملاكمة",price:3000,emoji:"🥊",image:""},
{id:5,name:"لعبة الطائرة",price:2500,emoji:"🚁",image:""},
{id:6,name:"كيس البوكس",price:3000,emoji:"🎁",image:""},
{id:7,name:"لعبة ممتعة للأطفال",price:4000,emoji:"🧸",image:""},
{id:8,name:"لوحة إلكترونية للأطفال",price:1800,emoji:"✏️",image:""},
{id:9,name:"لعبة النسر",price:2500,emoji:"🦅",image:""}
];

let products;
try {
const saved = localStorage.getItem(STORAGE_KEY);
products = saved ? JSON.parse(saved) : defaultProducts.map(p=>({...p}));
if(!Array.isArray(products)) products=defaultProducts.map(p=>({...p}));
} catch(e) {
products=defaultProducts.map(p=>({...p}));
}

let cart=[];

function persistProducts(){
try {
localStorage.setItem(STORAGE_KEY,JSON.stringify(products));
return true;
} catch(e) {
alert("تعذر حفظ التعديلات. قد تكون مساحة التخزين ممتلئة بسبب الصور.");
return false;
}
}

function displayProducts(){
const search=document.getElementById("search").value.trim().toLowerCase();
const box=document.getElementById("products");
box.innerHTML="";
products.filter(p=>String(p.name).toLowerCase().includes(search)).forEach(p=>{
const div=document.createElement("div");
div.className="product";
const pic=document.createElement("div");
pic.className="pic";
if(p.image){
const img=document.createElement("img");
img.src=p.image;img.alt=p.name;pic.appendChild(img);
}else{pic.textContent=p.emoji||"🧸";}
const name=document.createElement("h3");name.textContent=p.name;
const price=document.createElement("div");
price.className="price";price.textContent=Number(p.price).toLocaleString("fr-DZ")+" دج";
const btn=document.createElement("button");
btn.className="add";btn.textContent="🛒 أضف إلى السلة";
btn.onclick=()=>addToCart(p.id);
div.append(pic,name,price,btn);box.appendChild(div);
});
}

function addToCart(id){
const p=products.find(x=>x.id===id);
if(!p)return;
const item=cart.find(x=>x.id===id);
if(item)item.qty++;else cart.push({...p,qty:1});
renderCart();
}

function changeQty(id,amount){
const item=cart.find(x=>x.id===id);
if(!item)return;
item.qty+=amount;
if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
renderCart();
}

function removeItem(id){
cart=cart.filter(x=>x.id!==id);renderCart();
}

function clearCart(){cart=[];renderCart();}

function renderCart(){
const box=document.getElementById("cart");
box.innerHTML="";
if(!cart.length){
box.innerHTML='<div class="empty">السلة فارغة، اختر لعبة تعجبك 😊</div>';
document.getElementById("total").textContent="0";
return;
}
let total=0;
cart.forEach(item=>{
total+=Number(item.price)*item.qty;
const row=document.createElement("div");row.className="cart-item";
const info=document.createElement("div");
const strong=document.createElement("strong");strong.textContent=item.name;
const detail=document.createElement("div");
detail.textContent=Number(item.price).toLocaleString("fr-DZ")+" دج للوحدة";
info.append(strong,detail);
const controls=document.createElement("div");controls.className="qty";
const minus=document.createElement("button");minus.textContent="−";minus.onclick=()=>changeQty(item.id,-1);
const count=document.createElement("strong");count.textContent=item.qty;
const plus=document.createElement("button");plus.textContent="+";plus.onclick=()=>changeQty(item.id,1);
const remove=document.createElement("button");remove.className="remove";remove.textContent="×";remove.onclick=()=>removeItem(item.id);
controls.append(minus,count,plus,remove);row.append(info,controls);box.appendChild(row);
});
document.getElementById("total").textContent=total.toLocaleString("fr-DZ");
}

function sendOrder(){
if(!cart.length){alert("أضف منتجًا إلى السلة أولاً.");return;}
const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("phone").value.trim();
const wilaya=document.getElementById("wilaya").value;
const address=document.getElementById("address").value.trim();
const notes=document.getElementById("notes").value.trim();

if(!name||!phone||!wilaya||!address){
alert("يرجى ملء الاسم والهاتف والولاية والعنوان.");return;
}
if(!/^[0-9+\s()-]{8,20}$/.test(phone)){
alert("تحقق من رقم الهاتف.");return;
}

let total=0;
let message="طلبية جديدة من متجر دنيا الأطفال\n\n";
message+="الاسم واللقب: "+name+"\n";
message+="الهاتف: "+phone+"\n";
message+="الولاية: "+wilaya+"\n";
message+="العنوان: "+address+"\n\n";
message+="المنتجات:\n";
cart.forEach(item=>{
const sub=Number(item.price)*item.qty;total+=sub;
message+="- "+item.name+" × "+item.qty+" = "+sub+" دج\n";
});
message+="\nالمجموع: "+total+" دج\n";
if(notes)message+="ملاحظات: "+notes+"\n";
message+="\nشكراً لطلبكم من دنيا الأطفال.";

const url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(message);
window.open(url,"_blank");
}

function toggleAdmin(){
document.getElementById("adminPanel").classList.toggle("show");
if(document.getElementById("adminPanel").classList.contains("show"))renderAdmin();
}

function renderAdmin(){
const box=document.getElementById("adminProducts");box.innerHTML="";
products.forEach(p=>{
const card=document.createElement("div");card.className="admin-card";
if(p.image){
const img=document.createElement("img");img.src=p.image;img.alt=p.name;card.appendChild(img);
}else{
const pic=document.createElement("div");pic.className="admin-image";pic.textContent=p.emoji||"🧸";card.appendChild(pic);
}
const imageLabel=document.createElement("label");
imageLabel.className="image-label";imageLabel.textContent="📷 اختر صورة من الجهاز";
const file=document.createElement("input");
file.type="file";file.accept="image/*";file.className="image-input";
imageLabel.htmlFor="file-"+p.id;file.id="file-"+p.id;
file.onchange=e=>loadImage(e,p.id);
const name=document.createElement("input");name.value=p.name;name.placeholder="اسم المنتج";
const price=document.createElement("input");price.type="number";price.min="1";price.value=p.price;price.placeholder="السعر بالدينار";
const save=document.createElement("button");save.className="save-btn";save.textContent="💾 حفظ";
save.onclick=()=>{
const n=name.value.trim(),v=Number(price.value);
if(!n||!Number.isFinite(v)||v<=0){alert("تحقق من اسم المنتج وسعره.");return;}
p.name=n;p.price=v;
if(persistProducts()){displayProducts();renderAdmin();alert("تم حفظ المنتج.");}
};
const del=document.createElement("button");del.className="delete-btn";del.textContent="حذف المنتج";
del.onclick=()=>{
if(confirm("هل تريد حذف "+p.name+"؟")){
products=products.filter(x=>x.id!==p.id);
cart=cart.filter(x=>x.id!==p.id);
if(persistProducts()){displayProducts();renderCart();renderAdmin();}
}
};
card.append(imageLabel,file,name,price,save,del);box.appendChild(card);
});
}

function loadImage(event,id){
const file=event.target.files[0];if(!file)return;
if(!file.type.startsWith("image/")){alert("اختر ملف صورة.");return;}
if(file.size>1500000){alert("الصورة كبيرة. اختر صورة أصغر من 1.5 ميغابايت.");return;}
const reader=new FileReader();
reader.onload=e=>{
const p=products.find(x=>x.id===id);if(!p)return;
const old=p.image;p.image=e.target.result;
if(!persistProducts()){p.image=old;return;}
displayProducts();renderAdmin();
};
reader.readAsDataURL(file);
}

function addNewProduct(){
const id=Date.now();
products.push({id,name:"لعبة جديدة",price:1000,emoji:"🧸",image:""});
if(persistProducts()){displayProducts();renderAdmin();}
}

displayProducts();
renderCart();
</script>
</body>
</html>
