
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دنيا الأطفال | متجر ألعاب</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:linear-gradient(135deg,#ff6b6b,#ff9f43,#ffd32a);
color:white;
padding:25px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:32px;
}

header p{
margin:8px 0 0;
font-size:17px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin-bottom:20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.product{
background:white;
border-radius:16px;
padding:15px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
text-align:center;
}

.product .pic{
height:190px;
border-radius:12px;
background:#eee;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
margin-bottom:12px;
overflow:hidden;
}

.product img{
width:100%;
height:100%;
object-fit:cover;
}

.product h3{
margin:8px 0;
font-size:19px;
}

.price{
font-size:21px;
font-weight:bold;
color:#e74c3c;
margin:10px 0;
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
font-size:16px;
cursor:pointer;
}

.add{
background:#27ae60;
color:white;
width:100%;
}

.cart-box{
background:white;
margin-top:25px;
padding:20px;
border-radius:16px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border-bottom:1px solid #eee;
padding:12px 0;
}

.qty{
display:flex;
align-items:center;
gap:7px;
}

.qty button{
padding:5px 10px;
background:#eee;
}

.remove{
background:#e74c3c;
color:white;
padding:7px 10px;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:15px;
}

.order-form{
background:white;
margin-top:25px;
padding:20px;
border-radius:16px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.order-form h2{
margin-top:0;
color:#333;
}

.field{
margin-bottom:14px;
}

.field label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
font-family:inherit;
}

.field textarea{
height:90px;
resize:vertical;
}

.whatsapp{
background:#25D366;
color:white;
width:100%;
font-size:19px;
font-weight:bold;
margin-top:10px;
}

.clear{
background:#777;
color:white;
margin-top:10px;
}

.empty{
text-align:center;
padding:20px;
color:#777;
}

footer{
text-align:center;
padding:25px;
margin-top:30px;
background:#222;
color:white;
}

@media(max-width:600px){
header h1{
font-size:26px;
}

.container{
padding:12px;
}

.product .pic{
height:170px;
}
}
</style>
</head>

<body>

<header>
<h1>🎈 دنيا الأطفال 🎈</h1>
<p>ألعاب ممتعة للأطفال بأسعار مناسبة 🧸🎮⚽</p>
</header>

<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="🔎 ابحث عن لعبة..."
oninput="displayProducts()"
>

<div class="products" id="products"></div>

<div class="cart-box">
<h2>🛒 سلة المشتريات</h2>

<div id="cart"></div>

<div class="total">
المجموع: <span id="total">0</span> دج
</div>

<button class="clear" onclick="clearCart()">
إفراغ السلة
</button>
</div>

<div class="order-form">

<h2>📋 معلومات الزبون</h2>

<div class="field">
<label>👤 الاسم واللقب</label>
<input id="customerName" type="text" placeholder="اكتب الاسم واللقب">
</div>

<div class="field">
<label>📱 رقم الهاتف</label>
<input id="phone" type="tel" placeholder="مثال: 0550000000">
</div>

<div class="field">
<label>📍 الولاية</label>
<select id="wilaya">
<option value="">اختر الولاية</option>
<option>سطيف</option>
<option>برج بوعريريج</option>
<option>بجاية</option>
<option>قسنطينة</option>
<option>باتنة</option>
<option>المسيلة</option>
<option>العاصمة</option>
<option>عنابة</option>
<option>البليدة</option>
<option>وهران</option>
<option>تيزي وزو</option>
<option>جيجل</option>
<option>ميلة</option>
<option>قالمة</option>
<option>بسكرة</option>
<option>تبسة</option>
<option>سكيكدة</option>
<option>أخرى</option>
</select>
</div>

<div class="field">
<label>🏘️ البلدية / العنوان</label>
<input id="address" type="text" placeholder="اكتب البلدية والعنوان">
</div>

<div class="field">
<label>💬 ملاحظات</label>
<textarea id="notes" placeholder="مثلاً: اتصل بي قبل التوصيل"></textarea>
</div>

<button class="whatsapp" onclick="sendOrder()">
📲 تأكيد الطلب عبر WhatsApp
</button>

</div>

</div>

<footer>
دنيا الأطفال 🧸 | شكرًا لثقتكم بنا ❤️
</footer>

<script>

const WHATSAPP = "213674456415";

const products = [

{
id:1,
name:"SUP Game Box",
price:2500,
emoji:"🎮"
},

{
id:2,
name:"مزلاقة أطفال",
price:3200,
emoji:"🛝"
},

{
id:3,
name:"بيبي فوت",
price:4000,
emoji:"⚽"
},

{
id:4,
name:"كيس الملاكمة",
price:3000,
emoji:"🥊"
},

{
id:5,
name:"طاكي واكي",
price:2500,
emoji:"🧸"
},

{
id:6,
name:"كيس البوكس",
price:3000,
emoji:"🎁"
},

{
id:7,
name:"مزلاقة أطفال كبيرة",
price:4000,
emoji:"🛝"
},

{
id:8,
name:"لوحة إلكترونية للأطفال",
price:1800,
emoji:"📱"
},

{
id:9,
name:"نسر إلكتروني",
price:2500,
emoji:"🦅"
}

];

let cart = [];

function displayProducts(){

const search =
document.getElementById("search").value.toLowerCase();

const box =
document.getElementById("products");

box.innerHTML="";

products
.filter(p =>
p.name.toLowerCase().includes(search)
)
.forEach(p=>{

const div=document.createElement("div");

div.className="product";

div.innerHTML=`

<div class="pic">
${p.emoji}
</div>

<h3>${p.name}</h3>

<div class="price">
${p.price.toLocaleString()} دج
</div>

<button class="add" onclick="addToCart(${p.id})">
🛒 أضف إلى السلة
</button>

`;

box.appendChild(div);

});

}

function addToCart(id){

const product =
products.find(p=>p.id===id);

const existing =
cart.find(p=>p.id===id);

if(existing){
existing.qty++;
}else{
cart.push({
...product,
qty:1
});
}

renderCart();

}

function changeQty(id,amount){

const item =
cart.find(p=>p.id===id);

if(!item) return;

item.qty += amount;

if(item.qty<=0){
cart=cart.filter(p=>p.id!==id);
}

renderCart();

}

function removeItem(id){

cart=cart.filter(p=>p.id!==id);

renderCart();

}

function renderCart(){

const box =
document.getElementById("cart");

if(cart.length===0){

box.innerHTML=
'<div class="empty">السلة فارغة 🛒</div>';

document.getElementById("total").textContent="0";

return;

}

box.innerHTML="";

let total=0;

cart.forEach(item=>{

total += item.price * item.qty;

const div=document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<div>
<strong>${item.name}</strong><br>
${item.price.toLocaleString()} دج
</div>

<div class="qty">

<button onclick="changeQty(${item.id},-1)">−</button>

<strong>${item.qty}</strong>

<button onclick="changeQty(${item.id},1)">+</button>

<button class="remove"
onclick="removeItem(${item.id})">
×
</button>

</div>

`;

box.appendChild(div);

});

document.getElementById("total").textContent =
total.toLocaleString();

}

function clearCart(){

cart=[];

renderCart();

}

function sendOrder(){

if(cart.length===0){

alert("الرجاء إضافة منتج إلى السلة أولاً.");

return;

}

const name =
document.getElementById("customerName").value.trim();

const phone =
document.getElementById("phone").value.trim();

const wilaya =
document.getElementById("wilaya").value;

const address =
document.getElementById("address").value.trim();

const notes =
document.getElementById("notes").value.trim();

if(!name || !phone || !wilaya || !address){

alert("الرجاء ملء الاسم والهاتف والولاية والعنوان.");

return;

}

let message =
"🛒 *طلب جديد من متجر دنيا الأطفال*%0A%0A";

message +=
"👤 الاسم واللقب: " +
encodeURIComponent(name) +
"%0A";

message +=
"📱 الهاتف: " +
encodeURIComponent(phone) +
"%0A";

message +=
"📍 الولاية: " +
encodeURIComponent(wilaya) +
"%0A";

message +=
"🏘️ العنوان: " +
encodeURIComponent(address) +
"%0A%0A";

message += "🧸 *المنتجات:*%0A";

let total=0;

cart.forEach(item=>{

const subtotal =
item.price * item.qty;

total += subtotal;

message +=
"• " +
encodeURIComponent(item.name) +
" × " +
item.qty +
" = " +
subtotal.toLocaleString() +
" دج%0A";

});

message +=
"%0A💰 *المجموع: " +
total.toLocaleString() +
" دج*%0A";

if(notes){

message +=
"💬 ملاحظات: " +
encodeURIComponent(notes) +
"%0A";

}

message +=
"%0Aشكراً لكم ❤️";

const url =
"https://wa.me/" +
WHATSAPP +
"?text=" +
message;

window.open(url,"_blank");

}

displayProducts();

renderCart();

</script>

</body>
