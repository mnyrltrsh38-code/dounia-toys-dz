splice(index,1); updateCart(); } function searchProducts(){ const value=document.getElementById("search").value.toLowerCase(); const result=products.filter(p=> p.name.toLowerCase().includes(value) ); displayProducts(result); } function filterProducts(category){ const result=products.filter(p=> p.category===category ); displayProducts(result); } function showAll(){ displayProducts(products); } function goCart(){ document.getElementById("cart").scrollIntoView({ behavior:"smooth" }); } function sendOrder(){ if(cart.length===0){ alert("السلة فارغة ❌"); return; } const name=document.getElementById("name").value; const phone=document.getElementById("phone").value; const address=document.getElementById("address").value; const note=document.getElementById("note").value; if(!name || !phone || !address){ alert("يرجى إدخال الاسم والهاتف والعنوان"); return; } let message="طلب جديد من متجر دنيا الأطفال%0A%0A"; message+="الاسم: "+name+"%0A"; message+="الهاتف: "+phone+"%0A"; message+="العنوان: "+address+"%0A"; if(note){ message+="الملاحظة: "+note+"%0A"; } message+="%0Aالمنتجات:%0A"; let total=0; cart.forEach(p=>{ message+="- "+p.name+" : "+p.price+" دج%0A"; total+=p.price; }); message+="%0Aالمجموع: "+total+" دج"; const whatsapp="213000000000"; window.open( "https://wa.me/"+whatsapp+"?text="+message, "_blank" ); } displayProducts(); </script> </body> </html>
